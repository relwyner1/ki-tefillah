<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#1c2452">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="KIRS Tefillah">
  <title>KIRS Tefillah | Kehillath Israel</title>
  <meta name="description" content="Learn, practice, and lead tefillah with Kehillath Israel Religious School recordings.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="assets/images/icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="#" aria-label="KIRS Tefillah home">
      <img src="assets/images/ki-logo.png" alt="" class="brand-logo">
      <span class="brand-copy"><strong>KIRS Tefillah</strong><small>Learn · Practice · Lead</small></span>
    </a>
    <nav aria-label="Classes"><a href="#K-1">K–1</a><a href="#2-3">2–3</a><a href="#4-5">4–5</a></nav>
  </header>
  <main id="main"></main>
  <footer>A KIRS learning resource · Kehillath Israel<br>Recordings by Hazzan Ariel Wyner</footer>

  <dialog id="practice" aria-labelledby="prayer-title">
    <button class="close" aria-label="Close practice panel">×</button>
    <p class="eyebrow" id="class-label"></p>
    <h2 id="prayer-title"></h2>
    <p id="recording-note"></p>
    <div id="player">
      <audio id="audio" controls preload="metadata"></audio>
      <details class="practice-tools">
        <summary>Practice tools</summary>
        <div class="tools">
          <label>Speed<select id="speed"><option value="0.5">0.5×</option><option value="0.65">0.65×</option><option value="0.8">0.8×</option><option value="1" selected>1× Original</option><option value="1.15">1.15×</option><option value="1.3">1.3×</option><option value="1.5">1.5×</option></select></label>
          <label>Pitch<select id="pitch"><option value="-3">−3 semitones</option><option value="-2">−2 semitones</option><option value="-1">−1 semitone</option><option value="0" selected>Original pitch</option><option value="1">+1 semitone</option><option value="2">+2 semitones</option><option value="3">+3 semitones</option></select></label>
        </div>
        <div class="actions"><label><input id="repeat" type="checkbox"> Repeat recording</label><button id="restart">Start over</button><button id="reset">Reset controls</button></div>
      </details>
      <p class="status" id="status" role="status" aria-live="polite"></p>
    </div>
    <div class="text-head"><h3>Prayer text</h3><label><input id="show-translit" type="checkbox" checked> Transliteration</label></div>
    <p id="text-note" class="muted"></p><div id="prayer-text"></div>
  </dialog>
  <script src="data.js"></script><script src="app.js"></script>
  <script>if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}));}</script>
</body>
</html>
